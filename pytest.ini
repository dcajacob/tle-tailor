[pytest]
testpaths = tle_tailor/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    jax: marks tests that require JAX
    gmat: marks tests that require GMAT
    gmatpy: marks tests that require the standalone gmatpy wheel
    integration: marks tests as integration tests 
